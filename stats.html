<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STATS DASHBOARD | HIGASHINO BASKETBALL</title>

<style>
:root {
  --bg: #071426;
  --panel: #10243b;
  --panel2: #163858;
  --line: #29415b;
  --blue: #75c8ff;
  --white: #f4f8fc;
  --muted: #a9bdd2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 16px 50px;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, "Noto Sans JP", sans-serif;
}

.container {
  max-width: 1100px;
  margin: auto;
}

/* ヘッダー */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 35px;
}

.logo {
  color: var(--blue);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 3px;
}

h1 {
  font-size: clamp(30px, 5vw, 46px);
  margin: 8px 0;
  letter-spacing: 1px;
}

.team-name {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 2px;
}

.back-link {
  color: white;
  background: var(--panel2);
  border: 1px solid #376184;
  border-radius: 8px;
  padding: 11px 16px;
  text-decoration: none;
  font-size: 13px;
}

/* トップ画面 */
.page-title {
  color: var(--blue);
  font-size: 18px;
  margin: 30px 0 15px;
  letter-spacing: 1px;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.summary-card {
  background: linear-gradient(145deg, #163858, #10243b);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 22px;
  min-height: 125px;
}

.summary-label {
  color: var(--muted);
  font-size: 13px;
}

.summary-value {
  font-size: 34px;
  font-weight: bold;
  margin-top: 12px;
  color: white;
}

.summary-unit {
  font-size: 13px;
  color: var(--muted);
  margin-left: 5px;
}

/* メニューカード */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-top: 15px;
}

.menu-card {
  display: block;
  text-align: left;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 23px;
  color: white;
  cursor: pointer;
  transition: 0.2s;
  min-height: 125px;
}

.menu-card:hover {
  background: var(--panel2);
  border-color: var(--blue);
  transform: translateY(-3px);
}

.menu-number {
  color: var(--blue);
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.menu-name {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 8px;
}

.menu-description {
  color: var(--muted);
  font-size: 13px;
}

.arrow {
  float: right;
  color: var(--blue);
  font-size: 22px;
}

/* 詳細画面 */
.detail-page {
  display: none;
}

.detail-page.active {
  display: block;
}

.home-page.hidden {
  display: none;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}

.section-header h2 {
  color: var(--blue);
  font-size: 23px;
  margin: 0;
}

.home-button {
  background: var(--panel2);
  color: white;
  border: 1px solid #376184;
  border-radius: 8px;
  padding: 10px 15px;
  cursor: pointer;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 15px 0;
}

select {
  background: var(--panel);
  color: white;
  border: 1px solid #38516c;
  border-radius: 8px;
  padding: 11px;
  min-width: 180px;
}

.table-wrap {
  overflow-x: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin: 15px 0 25px;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 650px;
}

th, td {
  padding: 12px;
  text-align: center;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  font-size: 13px;
}

th {
  background: var(--panel2);
  color: var(--blue);
}

tbody tr:hover {
  background: #18334f;
}

.status {
  color: var(--muted);
  font-size: 12px;
  margin-top: 30px;
}

.player-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin: 15px 0;
}

.player-stat {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 15px;
}

.player-stat small {
  color: var(--muted);
}

.player-stat strong {
  display: block;
  font-size: 25px;
  margin-top: 7px;
}
/* 試合一覧のクリック */
#gamesTable tbody tr {
  cursor: pointer;
  transition: 0.2s;
}

#gamesTable tbody tr:hover {
  background: #245078;
}

#gamesTable tbody tr.selected {
  background: #245078;
  outline: 1px solid var(--blue);
}

/* 試合詳細 */
#gameDetail {
  border-top: 2px solid var(--blue);
  padding-top: 25px;
}

#gameDetailTitle {
  color: var(--blue);
}

.game-detail-card {
  background: linear-gradient(145deg, #163858, #10243b);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 17px;
}

.game-detail-card small {
  color: var(--muted);
  font-size: 12px;
}

.game-detail-card strong {
  display: block;
  font-size: 25px;
  margin-top: 7px;
}

.game-detail-note {
  color: var(--muted);
  font-size: 12px;
  margin: 10px 0;
}
@media(max-width: 650px) {
  body { padding: 18px 12px 35px; }

  .summary-grid {
    grid-template-columns: 1fr;
  }

  .summary-card {
    min-height: 100px;
  }

  .menu-grid {
    grid-template-columns: 1fr;
  }

  .menu-card {
    min-height: 110px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div>
    <div class="logo">HIGASHINO BASKETBALL</div>
    <h1>STATS DASHBOARD</h1>
    <div class="team-name">HIGASHINO HIGH SCHOOL</div>
  </div>

  <a href="members.html" class="back-link">← 会員ページ</a>
</header>

<!-- トップ画面 -->
<div id="homePage" class="home-page">

  <div class="page-title">TEAM OVERVIEW</div>

  <div class="summary-grid">

    <div class="summary-card">
      <div class="summary-label">試合数 / GAMES</div>
      <div class="summary-value" id="totalGames">--</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">平均得点 / AVG POINTS</div>
      <div class="summary-value" id="avgPoints">--</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">勝率 / WIN RATE</div>
      <div class="summary-value" id="winRate">--</div>
    </div>

  </div>

  <div class="page-title">MENU</div>

  <div class="menu-grid">

    <button class="menu-card" onclick="openPage('playersPage')">
      <div class="menu-number">01 / PLAYER</div>
      <div class="menu-name">
        選手別スタッツ <span class="arrow">›</span>
      </div>
      <div class="menu-description">
        得点・リバウンド・アシストなど
      </div>
    </button>

    <button class="menu-card" onclick="openPage('gamesPage')">
      <div class="menu-number">02 / GAME</div>
      <div class="menu-name">
        試合別スタッツ <span class="arrow">›</span>
      </div>
      <div class="menu-description">
        試合ごとのチーム成績
      </div>
    </button>

    <button class="menu-card" onclick="openPage('rankingPage')">
      <div class="menu-number">03 / RANKING</div>
      <div class="menu-name">
        ランキング <span class="arrow">›</span>
      </div>
      <div class="menu-description">
        得点・リバウンド等の順位
      </div>
    </button>

    <button class="menu-card" onclick="openPage('analysisPage')">
      <div class="menu-number">04 / ANALYSIS</div>
      <div class="menu-name">
        推移・分析 <span class="arrow">›</span>
      </div>
      <div class="menu-description">
        選手やチームの成長を確認
      </div>
    </button>

  </div>
</div>

<!-- 選手別スタッツ -->
<section id="playersPage" class="detail-page">
  <div class="section-header">
    <h2>PLAYER STATS</h2>
    <button class="home-button" onclick="goHome()">← TOP</button>
  </div>

  <div class="controls">
    <select id="playerSelect">
      <option value="">選手を選択してください</option>
    </select>
  </div>

  <div id="playerSummary" class="player-cards"></div>

  <h3>試合ごとの成績</h3>
  <div class="table-wrap">
    <table id="playerTable"></table>
  </div>
</section>

<!-- 試合別スタッツ -->
<section id="gamesPage" class="detail-page">
  <div class="section-header">
    <h2>GAME STATS</h2>
    <button class="home-button" onclick="goHome()">← TOP</button>
  </div>

  <div class="table-wrap">
    <table id="gamesTable"></table>
  </div>

  <!-- 選択した試合の詳細 -->
  <div id="gameDetail" style="display:none; margin-top:30px;">

    <div class="section-header">
      <h2 id="gameDetailTitle">GAME DETAIL</h2>
    </div>

    <div id="gameDetailSummary" class="player-cards"></div>

    <h3>TEAM BOX SCORE</h3>
    <div class="table-wrap">
      <table id="gameDetailTable"></table>
    </div>

  </div>
</section>

<!-- ランキング -->
<section id="rankingPage" class="detail-page">
  <div class="section-header">
    <h2>PLAYER RANKING</h2>
    <button class="home-button" onclick="goHome()">← TOP</button>
  </div>

  <div class="controls">
    <select id="rankMetric">
      <option value="PTS平均">平均得点</option>
      <option value="PTS合計">総得点</option>
      <option value="REB">リバウンド</option>
      <option value="AST">アシスト</option>
      <option value="STL">スティール</option>
      <option value="BLK">ブロック</option>
      <option value="EFF平均">平均EFF</option>
      <option value="FG%">FG%</option>
      <option value="3P%">3P%</option>
      <option value="FT%">FT%</option>
    </select>
  </div>

  <div class="table-wrap">
    <table id="rankingTable"></table>
  </div>
</section>

<!-- 推移・分析 -->
<section id="analysisPage" class="detail-page">
  <div class="section-header">
    <h2>PERFORMANCE ANALYSIS</h2>
    <button class="home-button" onclick="goHome()">← TOP</button>
  </div>

  <h3>チーム得点の推移</h3>
  <div class="table-wrap">
    <table id="trendTable"></table>
  </div>

  <h3>選手別パフォーマンス推移</h3>
  <div class="controls">
    <select id="trendPlayer">
      <option value="">選手を選択してください</option>
    </select>
  </div>

  <div class="table-wrap">
    <table id="trendPlayerTable"></table>
  </div>
</section>

<p id="status" class="status">データを読み込んでいます...</p>

</div>

<script>

// Googleスプレッドシート CSV URL
const CSV = {
  season: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRf7cKFzw5iX_Ux4YfmwMlIQ9cxFdFqsbr-emJF_cuqMJPkI7nwg3qh2_0pCLv8OA/pub?gid=730056898&single=true&output=csv",

  individual: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRf7cKFzw5iX_Ux4YfmwMlIQ9cxFdFqsbr-emJF_cuqMJPkI7nwg3qh2_0pCLv8OA/pub?gid=577494274&single=true&output=csv",

  games: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRf7cKFzw5iX_Ux4YfmwMlIQ9cxFdFqsbr-emJF_cuqMJPkI7nwg3qh2_0pCLv8OA/pub?gid=579539540&single=true&output=csv"
};

// ログイン確認
const loginTime = Number(localStorage.getItem("higashinoMembersLogin"));

if (!loginTime || Date.now() - loginTime > 10 * 60 * 1000) {
  localStorage.removeItem("higashinoMembersLogin");
  location.href = "members.html";
}

let seasonRows = [];
let individualRows = [];
let gameRows = [];

const $ = id => document.getElementById(id);

const num = v => {
  const n = Number(String(v ?? "").replace(/,/g, "").replace("%", ""));
  return Number.isFinite(n) ? n : 0;
};

const pct = v => {
  if (v === "" || v == null) return "—";
  const n = num(v);
  return String(v).includes("%")
    ? n + "%"
    : (n <= 1 ? n * 100 : n).toFixed(1) + "%";
};

// 画面切り替え
function openPage(id) {
  $("homePage").classList.add("hidden");

  document.querySelectorAll(".detail-page").forEach(p => {
    p.classList.remove("active");
  });

  $(id).classList.add("active");
  window.scrollTo(0, 0);
}

function goHome() {
  document.querySelectorAll(".detail-page").forEach(p => {
    p.classList.remove("active");
  });

  $("homePage").classList.remove("hidden");
  window.scrollTo(0, 0);
}

// CSV解析
function parseCSV(text) {
  const out = [];
  let row = [], cell = "", q = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (c === '"') {
      if (q && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        q = !q;
      }
    } else if (c === ',' && !q) {
      row.push(cell);
      cell = "";
    } else if ((c === '\n' || c === '\r') && !q) {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell);
      if (row.some(x => x.trim())) out.push(row);
      row = [];
      cell = "";
    } else {
      cell += c;
    }
  }

  row.push(cell);
  if (row.some(x => x.trim())) out.push(row);

  return out;
}

function objects(rows) {
  if (!rows.length) return [];

  const headers = rows[0].map(x =>
    x.trim().replace(/^\uFEFF/, "")
  );

  return rows.slice(1)
    .map(r => Object.fromEntries(
      headers.map((h, i) => [h, (r[i] ?? "").trim()])
    ))
    .filter(o => Object.values(o).some(v => v !== ""));
}

async function fetchSheet(url) {
  const res = await fetch(url + "&cache=" + Date.now());

  if (!res.ok) throw new Error("CSV取得エラー");

  const text = await res.text();

  if (text.trim().startsWith("<")) {
    throw new Error("CSV公開設定を確認してください");
  }

  return objects(parseCSV(text));
}

// 表作成
function makeTable(id, headers, rows) {
  const target = $(id);
  target.innerHTML = "";

  if (!rows.length) {
    target.innerHTML =
      '<tbody><tr><td>データがありません</td></tr></tbody>';
    return;
  }

  const thead = document.createElement("thead");
  const tr = document.createElement("tr");

  headers.forEach(h => {
    const th = document.createElement("th");
    th.textContent = h;
    tr.appendChild(th);
  });

  thead.appendChild(tr);
  target.appendChild(thead);

  const tbody = document.createElement("tbody");

  rows.forEach(row => {
    const tr = document.createElement("tr");

    row.forEach(v => {
      const td = document.createElement("td");
      td.textContent = v === "" || v == null ? "—" : v;
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  target.appendChild(tbody);
}

// チーム成績
function renderTeam() {
  const played = gameRows.filter(g =>
    g["対戦相手"] &&
    (g["東野得点"] !== "" || g["相手得点"] !== "")
  );

  let wins = 0;
  let totalPoints = 0;

  played.forEach(g => {
    const a = num(g["東野得点"]);
    const b = num(g["相手得点"]);

    totalPoints += a;
    if (a > b) wins++;
  });

  $("totalGames").textContent = played.length;

  $("avgPoints").textContent =
    played.length ? (totalPoints / played.length).toFixed(1) : "--";

  $("winRate").textContent =
    played.length ? (wins / played.length * 100).toFixed(1) + "%" : "--";
}

// 選手選択欄
function setupPlayers() {
  const names = [
    ...new Set(seasonRows.map(r => r["選手名"]).filter(Boolean))
  ];

  ["playerSelect", "trendPlayer"].forEach(id => {
    $(id).innerHTML =
      '<option value="">選手を選択してください</option>' +
      names.map(n =>
        `<option value="${n.replace(/&/g, "&amp;").replace(/"/g, "&quot;")}">${n}</option>`
      ).join("");
  });
}

// 選手別スタッツ
function renderPlayer() {
  const name = $("playerSelect").value;

  $("playerSummary").innerHTML = "";

  if (!name) {
    makeTable("playerTable", [], []);
    return;
  }

  const s = seasonRows.find(r => r["選手名"] === name);

  if (s) {
    const metrics = [
      ["出場試合", s["GP"]],
      ["総得点", s["PTS合計"]],
      ["平均得点", s["PTS平均"]],
      ["REB", s["REB"]],
      ["AST", s["AST"]],
      ["EFF平均", s["EFF平均"]]
    ];

    $("playerSummary").innerHTML = metrics.map(m =>
      `<div class="player-stat">
        <small>${m[0]}</small>
        <strong>${m[1] || "—"}</strong>
      </div>`
    ).join("");
  }

  const rows = individualRows.filter(r => r["選手名"] === name);

  makeTable(
    "playerTable",
    ["日付", "対戦相手", "PTS", "REB", "AST", "STL", "BLK", "TO", "FG%", "3P%", "FT%", "EFF"],
    rows.map(r => [
      r["試合日"], r["対戦相手"], r["PTS"], r["REB"],
      r["AST"], r["STL"], r["BLK"], r["TO"],
      pct(r["FG%"]), pct(r["3P%"]), pct(r["FT%"]), r["EFF"]
    ])
  );
}

// 試合別スタッツ
// 試合別スタッツ
// 試合別スタッツ
function renderGames() {
  const target = $("gamesTable");
  target.innerHTML = "";

  const rows = gameRows.filter(g => g["対戦相手"]);

  $("gameDetail").style.display = "none";

  const headers = [
    "日付", "大会", "対戦相手",
    "東野得点", "相手得点", "結果", "詳細"
  ];

  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");

  headers.forEach(h => {
    const th = document.createElement("th");
    th.textContent = h;
    headRow.appendChild(th);
  });

  thead.appendChild(headRow);
  target.appendChild(thead);

  const tbody = document.createElement("tbody");

  rows.forEach(g => {
    const tr = document.createElement("tr");

    const a = num(g["東野得点"]);
    const b = num(g["相手得点"]);

    const result = a > b ? "WIN" : a < b ? "LOSE" : "DRAW";

    const values = [
      g["試合日"],
      g["大会名"],
      g["対戦相手"],
      g["東野得点"],
      g["相手得点"],
      result,
      "詳細を見る ›"
    ];

    values.forEach(v => {
      const td = document.createElement("td");
      td.textContent = v || "—";
      tr.appendChild(td);
    });

    // ここが試合をクリックしたときの処理
    tr.style.cursor = "pointer";

    tr.addEventListener("click", function() {
      document.querySelectorAll("#gamesTable tbody tr")
        .forEach(row => row.classList.remove("selected"));

      tr.classList.add("selected");

      renderGameDetail(g);
    });

    tbody.appendChild(tr);
  });

  target.appendChild(tbody);
}

// 試合詳細表示
function renderGameDetail(g) {
  const detail = $("gameDetail");
  detail.style.display = "block";

  const rows = individualRows.filter(r =>
    String(r["試合日"]).trim() === String(g["試合日"]).trim() &&
    String(r["対戦相手"]).trim() === String(g["対戦相手"]).trim()
  );

  const a = num(g["東野得点"]);
  const b = num(g["相手得点"]);
  const result = a > b ? "WIN" : a < b ? "LOSE" : "DRAW";

  $("gameDetailTitle").textContent =
    g["試合日"] + "  " + g["対戦相手"];

  $("gameDetailSummary").innerHTML = `
    <div class="player-stat">
      <small>東野得点</small>
      <strong>${a}</strong>
    </div>
    <div class="player-stat">
      <small>相手得点</small>
      <strong>${b}</strong>
    </div>
    <div class="player-stat">
      <small>RESULT</small>
      <strong>${result}</strong>
    </div>
  `;

  makeTable(
    "gameDetailTable",
    ["選手", "背番号", "PTS", "REB", "AST", "STL", "BLK", "TO", "FG%", "3P%", "FT%", "EFF"],
    rows.map(r => [
      r["選手名"], r["背番号"], r["PTS"], r["REB"],
      r["AST"], r["STL"], r["BLK"], r["TO"],
      pct(r["FG%"]), pct(r["3P%"]), pct(r["FT%"]), r["EFF"]
    ])
  );
}
// ランキング
function renderRanking() {
  const metric = $("rankMetric").value;

  const sorted = seasonRows
    .filter(r => r["選手名"])
    .slice()
    .sort((a, b) => num(b[metric]) - num(a[metric]));

  makeTable(
    "rankingTable",
    ["順位", "選手", "背番号", "出場", "PTS平均", "REB", "AST", "STL", "BLK", "EFF平均", "選択項目"],
    sorted.map((r, i) => [
      i + 1, r["選手名"], r["背番号"], r["GP"],
      r["PTS平均"], r["REB"], r["AST"], r["STL"],
      r["BLK"], r["EFF平均"],
      ["FG%", "3P%", "FT%"].includes(metric) ? pct(r[metric]) : r[metric]
    ])
  );
}

// チーム得点の推移
function renderTrend() {
  const rows = gameRows.filter(g => g["対戦相手"]);

  makeTable(
    "trendTable",
    ["日付", "対戦相手", "東野得点", "相手得点", "得失点差"],
    rows.map(g => [
      g["試合日"],
      g["対戦相手"],
      g["東野得点"],
      g["相手得点"],
      num(g["東野得点"]) - num(g["相手得点"])
    ])
  );
}

// 選手別パフォーマンス推移
function renderPlayerTrend() {
  const name = $("trendPlayer").value;

  if (!name) {
    makeTable("trendPlayerTable", [], []);
    return;
  }

  const rows = individualRows.filter(r => r["選手名"] === name);

  makeTable(
    "trendPlayerTable",
    ["日付", "対戦相手", "PTS", "REB", "AST", "STL", "BLK", "EFF"],
    rows.map(r => [
      r["試合日"], r["対戦相手"], r["PTS"],
      r["REB"], r["AST"], r["STL"], r["BLK"], r["EFF"]
    ])
  );
}

// イベント
$("playerSelect").addEventListener("change", renderPlayer);
$("rankMetric").addEventListener("change", renderRanking);
$("trendPlayer").addEventListener("change", renderPlayerTrend);

// 初期読み込み
(async function init() {
  try {
    [seasonRows, individualRows, gameRows] = await Promise.all([
      fetchSheet(CSV.season),
      fetchSheet(CSV.individual),
      fetchSheet(CSV.games)
    ]);

    setupPlayers();
    renderTeam();
    renderGames();
    renderRanking();
    renderTrend();

    $("status").textContent =
      `データ更新完了｜選手 ${seasonRows.length}名・個人成績 ${individualRows.length}件・試合 ${gameRows.length}件`;

  } catch (e) {
    $("status").textContent =
      "データを読み込めませんでした：" + e.message +
      "。スプレッドシートの公開設定を確認してください。";

    console.error(e);
  }
})();

</script>
</body>
</html>
